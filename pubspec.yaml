name: hawkbee_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace: []

dev_dependencies:
  melos: ^8.2.2

melos:
  repository: https://github.com/hawkbee1/hawkbee

  scripts:
    analyze:
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
      description: Run dart analyze in all packages.

    format:
      run: dart format --set-exit-if-changed .
      description: Check formatting across the workspace.

    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests in all packages that have a test directory.
