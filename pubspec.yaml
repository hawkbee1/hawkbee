name: hawkbee_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/battle_team
  - apps/dart_code_3d
  - apps/hawkbee
  - packages/appwrite_api_client
  - packages/backend_status_repository
  - packages/code_graph
  - packages/code_source_client
  - packages/hawkbee_schema

# flutter_scene (submodule) and our code_graph must share the same local `scene`.
dependency_overrides:
  scene:
    path: packages/flutter_scene/packages/scene

dev_dependencies:
  melos: ^8.2.2

melos:
  repository: https://github.com/hawkbee1/hawkbee

  scripts:
    analyze:
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
      description: Run dart analyze in all packages.

    # Lists our own code explicitly so third-party submodules (packages/flutter_scene)
    # are never formatted. Add every new app or package of ours here.
    format:
      run: dart format --set-exit-if-changed apps/hawkbee apps/battle_team apps/dart_code_3d packages/appwrite_api_client packages/backend_status_repository packages/code_graph packages/code_source_client packages/hawkbee_schema tool backend
      description: Check formatting of our own code (not third-party submodules).

    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests in all packages that have a test directory.

    visual:test:
      run: tool/visual_test.sh
      description: dart_code_3D 3D visual tests (Linux desktop under Xvfb). Add --update to refresh baselines.

    # Appwrite Functions live outside the pub workspace: the CLI uploads only
    # the function's folder, so each one resolves its own dependencies and
    # gets a vendored copy of hawkbee_schema.
    backend:vendor:
      run: dart run tool/vendor_schema.dart
      description: Copy hawkbee_schema into every Dart function under backend/functions.

    backend:vendor:check:
      run: dart run tool/vendor_schema.dart && git diff --exit-code -- backend/functions && test -z "$(git status --porcelain -- backend/functions)"
      description: Fail if a function's vendored hawkbee_schema is out of date (run in CI).

    backend:analyze:
      run: dart run tool/vendor_schema.dart --pub-get && dart analyze --fatal-infos backend/functions
      description: Vendor hawkbee_schema, then analyze the Appwrite Functions.

    backend:test:
      run: dart run tool/vendor_schema.dart --pub-get && for f in backend/functions/*/; do (cd "$f" && dart test) || exit 1; done
      description: Vendor hawkbee_schema, then run each function's tests.

    backend:deploy:
      run: dart run tool/vendor_schema.dart && cd backend && appwrite push all --all --force
      description: Vendor hawkbee_schema and push the backend (settings, tables, functions) to the selected Appwrite project.
